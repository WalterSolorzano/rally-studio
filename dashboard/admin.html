<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Â· Rally Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261117_admin3">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <header class="admin-head">
      <a href="/" class="admin-back" aria-label="Volver al trabajo" title="Volver al trabajo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Admin</h1>
      <span id="admin-who" class="admin-who"></span>
    </header>

    <p id="admin-status" role="status" aria-live="polite"></p>

    <section class="admin-panel" aria-labelledby="t-certamen">
      <h2 id="t-certamen">Certamen</h2>
      <div class="certamen-choice" role="radiogroup" aria-label="Certamen">
        <label class="choice-card" data-rally="latam">
          <input type="radio" name="rally" value="latam">
          <img src="assets/logo_rally_latam.png" alt="Rally Latinoamericano">
          <span class="choice-hours">28 H</span>
          <span class="choice-check" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
        </label>
        <label class="choice-card" data-rally="nacional">
          <input type="radio" name="rally" value="nacional">
          <img src="assets/logo_rally_nacional.png" alt="Rally Nacional">
          <span class="choice-hours">24 H</span>
          <span class="choice-check" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
        </label>
      </div>
      <div class="admin-actions">
        <button id="save-certamen" class="primary" type="button">Guardar certamen</button>
      </div>
    </section>

    <section class="admin-panel" aria-labelledby="t-identity">
      <h2 id="t-identity">Identidad</h2>
      <form id="identity-form" class="identity-grid" autocomplete="off">
        <label class="field"><span>Squad</span><input id="id-squad" type="text" maxlength="60" required></label>
        <label class="field"><span>Universidad</span><input id="id-uni" type="text" maxlength="80" required></label>
        <label class="field"><span>Ciudad</span><input id="id-city" type="text" maxlength="60"></label>
        <div class="field field-logo">
          <span>Logo</span>
          <label class="logo-drop" title="Subir logo">
            <input id="id-logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
            <img id="identity-logo-preview" alt="Logo del equipo" hidden>
            <span id="logo-hint" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </span>
          </label>
        </div>
        <div class="admin-actions identity-actions">
          <button id="save-identity" class="primary" type="submit">Guardar identidad</button>
        </div>
      </form>
    </section>

    <section class="admin-panel" aria-labelledby="t-access">
      <h2 id="t-access">Accesos</h2>
      <div class="admin-actions">
        <button id="create-invite" class="primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Invitar
        </button>
        <label class="ttl"><span>Entra como</span>
          <select id="invite-role">
            <option value="member" selected>Miembro</option>
            <option value="mentor">Mentor</option>
            <option value="visitor">Visitante</option>
          </select>
        </label>
        <label class="ttl"><span>Vence</span>
          <select id="invite-ttl">
            <option value="24">24 h</option>
            <option value="48" selected>48 h</option>
            <option value="168">7 d</option>
          </select>
        </label>
        <button id="copy-invite" class="ghost" type="button" hidden>Copiar</button>
      </div>
      <output id="invite-url" aria-live="polite"></output>
      <p class="invite-nota">Visitante: una sola vez y caduca en 1 hora.</p>
      <div id="members-list"></div>
      <div class="admin-actions admin-panic">
        <button id="close-all" class="danger" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Cerrar todas las sesiones
        </button>
        <button id="load-audit" class="ghost" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          Ver registro
        </button>
      </div>
      <div id="audit-list"></div>
    </section>

    <details class="admin-panel admin-advanced">
      <summary>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2l-2 2m-7.6 7.6a5 5 0 1 1-7.1 7.1 5 5 0 0 1 7.1-7.1zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>
        SesiÃ³n
      </summary>
      <div class="admin-actions">
        <input id="admin-token" type="password" autocomplete="off" placeholder="Token" aria-label="Token de operador">
        <button id="save-token" class="primary" type="button">Usar</button>
      </div>
      <p id="session-state" class="admin-hint"></p>
    </details>
  </main>
  <script src="avatars.js?v=20261117_rev7" defer></script>
  <script src="admin.js?v=20261117_rev3" defer></script>
</body>
</html>
