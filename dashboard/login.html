<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Entrar · Rally Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <meta name="theme-color" content="#0e0e0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261116_rev1">
  <style>
    /* style.css dibuja el workbench como una grilla de 3 columnas
       (240 | área | 300). Sin esto, la puerta cae en la columna del menú
       lateral: queda pegada a la izquierda y la tarjeta se sale del cuadro. */
    body {
      display: block;
      height: auto;
      min-height: 100vh;
      overflow: auto;
      grid-template-columns: none;
      grid-template-rows: none;
      grid-template-areas: none;
    }
    .puerta { min-height: 100vh; display: grid; place-items: center; background: var(--bg-subtle); padding: 24px; }
    .puerta-forma {
      width: min(384px, calc(100vw - 48px));
      padding: 28px 26px 22px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .puerta-marca { display: block; width: 44px; height: 44px; margin-bottom: 18px; }
    .puerta-titulo {
      font: 800 var(--text-xl)/1.2 var(--font-ui); color: var(--text-title);
      letter-spacing: -0.01em; margin: 0 0 4px;
    }
    .puerta-nota {
      font: 400 var(--text-xs)/1.5 var(--font-mono); color: var(--text-faint);
      margin: 0 0 22px; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .puerta-campo {
      width: 100%; box-sizing: border-box; padding: 11px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-surface); color: var(--text-title);
      font: 600 15px/1.2 var(--font-mono); letter-spacing: 0.08em;
      text-transform: uppercase; outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .puerta-campo::placeholder { color: var(--text-faint); font-weight: 400; letter-spacing: 0.02em; text-transform: none; }
    .puerta-campo:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(8, 102, 245, .16);
    }
    .puerta-nombre { text-transform: none; letter-spacing: 0; font-size: var(--text-md); font-family: var(--font-ui); }
    .puerta-accion {
      width: 100%; margin-top: 18px; padding: 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: var(--radius-sm);
      background: var(--color-primary); color: #fff;
      font: 700 var(--text-md) var(--font-ui); cursor: pointer;
      transition: background .15s ease;
    }
    .puerta-accion:hover { background: var(--color-primary-hover); }
    .puerta-accion:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .puerta-accion:disabled { background: var(--border-strong); cursor: progress; }
    .puerta-estado {
      margin-top: 16px; min-height: 18px;
      font: 400 var(--text-xs)/1.5 var(--font-mono); color: var(--text-muted);
    }
    .puerta-estado[data-tono="error"] {
      padding: 8px 10px; border-radius: var(--radius-sm);
      background: var(--status-err-bg); color: var(--status-err-text);
      border: 1px solid var(--status-err-border);
      animation: puerta-aviso .18s ease-out backwards;
    }
    @keyframes puerta-aviso {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: none; }
    }
    .puerta-pie {
      margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border-light);
      display: flex; align-items: center; gap: 8px;
      font: 400 var(--text-xs) var(--font-mono); color: var(--text-faint);
    }
    .puerta-alterno {
      margin-top: 12px; padding: 0; border: 0; background: none;
      font: 600 var(--text-xs) var(--font-ui); color: var(--color-primary);
      cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    }

    .puerta-ver {
      align-self: stretch; padding: 0 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--bg-subtle); color: var(--text-body);
      font: 700 var(--text-xs) var(--font-ui);
      cursor: pointer;
      transition: background-color .14s ease, border-color .14s ease, color .14s ease;
    }
    .puerta-ver:hover { border-color: var(--border-focus); }
    .puerta-ver:active { transform: scale(.97); }
    .puerta-ver:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .puerta-ver[aria-pressed="true"] { color: var(--color-primary); }

    /* Etiqueta arriba del campo: nunca hay que adivinar que va donde. */
    .puerta-etiqueta {
      display: block; margin: 0 0 6px;
      font: 700 var(--text-xs) var(--font-ui); color: var(--text-body);
    }
    .puerta-etiqueta + .puerta-campo { margin-bottom: 14px; }
    .puerta-fila { display: flex; gap: 8px; margin-bottom: 14px; }
    .puerta-fila .puerta-campo { flex: 1; margin-bottom: 0; }
    .puerta-detalle { margin-top: 6px; }
    .puerta-detalle summary {
      cursor: pointer; font: 600 var(--text-xs) var(--font-ui);
      color: var(--text-faint); padding: 6px 0;
      transition: color .14s ease;
    }
    .puerta-detalle[open] summary { color: var(--text-body); }
    .puerta-detalle form { margin-top: 10px; }

    /* --- Carga y entrada: la marca se dibuja, igual que en la invitacion --- */
    .puerta-carga, .puerta-espera {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: var(--bg-subtle);
      transition: opacity .4s ease, visibility .4s ease;
    }
    .puerta-espera { z-index: 95; background: rgba(248, 250, 253, .95); backdrop-filter: blur(3px); opacity: 0; visibility: hidden; }
    .puerta-espera.is-on { opacity: 1; visibility: visible; }
    .puerta-espera[hidden] { display: none; }
    .puerta-carga.is-oculto { opacity: 0; visibility: hidden; pointer-events: none; }
    .puerta-carga-marca { width: 78px; height: 52px; }
    .puerta-espera-marca { width: 150px; height: 100px; }
    .puerta-carga-marca line, .puerta-espera-marca line {
      stroke: var(--color-primary);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 38;
      stroke-dashoffset: 38;
      animation: puerta-dibuja 1.7s ease-in-out infinite;
    }
    .puerta-carga-marca line:nth-child(2), .puerta-espera-marca line:nth-child(2) { animation-delay: .18s; }
    @keyframes puerta-dibuja {
      0% { stroke-dashoffset: 38; }
      45%, 70% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 38; }
    }
    .puerta-carga-word { font: 800 13px/1 var(--font-ui); letter-spacing: .24em; color: var(--text-title); }
    .puerta-espera-txt { font: 900 30px/1.1 var(--font-ui); color: var(--text-title); }
    .puerta-espera-barra, .puerta-carga-barra {
      width: 220px; height: 4px; border-radius: 99px;
      background: var(--border-light); overflow: hidden; position: relative;
    }
    .puerta-espera-barra::after, .puerta-carga-barra::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: inherit;
      background: var(--color-primary);
      animation: puerta-corre 1.2s ease-in-out infinite;
    }
    @keyframes puerta-corre { 0% { transform: translateX(-105%); } 100% { transform: translateX(235%); } }
    @media (prefers-reduced-motion: reduce) {
      .puerta-carga, .puerta-espera, .puerta-carga-marca, .puerta-espera-marca,
      .puerta-carga-marca line, .puerta-espera-marca line,
      .puerta-carga-barra::after, .puerta-espera-barra::after { animation: none !important; }
      .puerta-carga-marca line, .puerta-espera-marca line { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="puerta-carga" id="puerta-carga" role="status" aria-live="polite" aria-label="Abriendo Rally Studio">
    <svg class="puerta-carga-marca" viewBox="0 0 60 40" fill="none" aria-hidden="true">
      <line x1="14" y1="34" x2="26" y2="6"></line>
      <line x1="30" y1="34" x2="42" y2="6"></line>
    </svg>
    <span class="puerta-carga-word" aria-hidden="true">RALLY STUDIO</span>
    <span class="puerta-carga-barra" aria-hidden="true"></span>
  </div>
  <div class="puerta-espera" id="puerta-entrando" hidden role="status" aria-live="assertive">
    <svg class="puerta-espera-marca" viewBox="0 0 60 40" fill="none" aria-hidden="true">
      <line x1="14" y1="34" x2="26" y2="6"></line>
      <line x1="30" y1="34" x2="42" y2="6"></line>
    </svg>
    <p class="puerta-espera-txt">Entrando…</p>
    <span class="puerta-espera-barra" aria-hidden="true"></span>
  </div>
  <main class="puerta">
    <div class="puerta-forma">
      <img class="puerta-marca" src="assets/app-mark.svg" alt="" width="56" height="56">
      <h1 class="puerta-titulo">Entrar</h1>
      <p class="puerta-nota" id="puerta-nota">Tu nombre y tu clave</p>

      <form id="puerta-form" autocomplete="off">
        <label class="puerta-etiqueta" for="puerta-persona">Tu nombre</label>
        <input class="puerta-campo puerta-persona" id="puerta-persona" name="persona" type="text"
               placeholder="Como apareces en el equipo" autocomplete="username">
        <label class="puerta-etiqueta" for="puerta-clave">Tu clave</label>
        <div class="puerta-fila">
          <input class="puerta-campo puerta-persona" id="puerta-clave" name="clave" type="password"
                 placeholder="La que elegiste al entrar" autocomplete="current-password">
          <button class="puerta-ver" id="puerta-ver" type="button"
                  aria-label="Mostrar la clave" aria-pressed="false" title="Mostrar la clave">Ver</button>
        </div>
        <button class="puerta-accion" id="puerta-entrar" type="submit">Entrar</button>
      </form>

      <div class="puerta-estado" id="puerta-estado" role="status"></div>

      <details class="puerta-detalle" id="puerta-panel-llave">
        <summary>Tengo la llave del equipo</summary>
        <form id="puerta-form-llave" autocomplete="off">
          <label class="puerta-etiqueta" for="puerta-llave">Llave</label>
          <input class="puerta-campo" id="puerta-llave" name="llave" type="password"
                 placeholder="XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters">
          <input class="puerta-campo puerta-nombre" id="puerta-nombre" name="nombre" type="text"
                 placeholder="Tu nombre (solo la primera vez)" style="display:none; margin-top:10px;">
          <button class="puerta-accion" id="puerta-entrar-llave" type="submit">Abrir con la llave</button>
        </form>
      </details>

      <div class="puerta-pie">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="4" y="10" width="16" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        <span id="puerta-miembros">—</span>
      </div>
    </div>
  </main>
  <script src="login.js?v=20261122_rev5"></script>
</body>
</html>
